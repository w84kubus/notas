# Notas.pl na Fly.io. Zmień `app` na własną, unikalną nazwę.
app = "notas-pl"
primary_region = "waw"   # Warszawa

[build]

[env]
  PORT = "8787"
  ROOM_TTL_HOURS = "12"

[http_service]
  internal_port = 8787
  force_https = true
  # Pokoje żyją w pamięci procesu: maszyna nie może się usypiać ani być zdublowana.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
